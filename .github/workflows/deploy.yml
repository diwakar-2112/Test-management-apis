name: CI/CD Pipeline - Build, Containerize & Deploy to AWS EC2

on:
  push:
    branches:
      - stg_v1  # Change to 'master' if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out latest code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java 17 runtime for build
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Compile and package the Spring Boot JAR
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 4. Authenticate to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build Docker Image and push to Docker Hub
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: devdocker223/test-management-api:latest

      # 6. SSH into EC2, pull image, and run the container
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--- Pulling latest Docker image from Docker Hub ---"
            docker pull devdocker223/test-management-api:latest

            echo "--- Stopping existing container (if any) ---"
            docker stop testportal-backend || true
            docker rm testportal-backend || true

            echo "--- Starting new production container ---"
            docker run -d \
              --name testportal-backend \
              --restart always \
              -p 8080:8080 \
              -e DB_URL="jdbc:mysql://testportal-db.cta6c6ekavgm.ap-south-1.rds.amazonaws.com:3306/testportal_db?allowPublicKeyRetrieval=true&useSSL=false" \
              -e DB_USERNAME="admin" \
              -e DB_PASSWORD="DiwakarawsPassword778" \
              -e JWT_SECRET="S3cr3tK3yF0rT3stM4n4g3m3ntP0rt4lV3ryL0ngAndS3cur3Ind33d1234567890!@#" \
              devdocker223/test-management-api:latest

            echo "--- Deployment Complete! Current Containers: ---"
            sleep 5
            docker ps